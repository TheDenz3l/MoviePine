<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continue Watching Test - End-to-End</title>
    <style>
        body { 
            font-family: monospace; 
            max-width: 900px; 
            margin: 50px auto; 
            padding: 20px; 
            background: #1a1a1a; 
            color: #00ff00; 
        }
        .console { 
            background: #000; 
            padding: 20px; 
            border-radius: 5px; 
            height: 500px; 
            overflow-y: auto; 
            border: 1px solid #333; 
            white-space: pre-wrap;
        }
        button { 
            background: #333; 
            color: #00ff00; 
            border: 1px solid #555; 
            padding: 10px 20px; 
            cursor: pointer; 
            margin: 10px 5px; 
        }
        button:hover { background: #444; }
        .step { margin: 20px 0; }
        .success { color: #00ff00; }
        .error { color: #ff0000; }
        .warning { color: #ffaa00; }
        .info { color: #00aaff; }
    </style>
</head>
<body>
    <h1>🎬 Continue Watching End-to-End Test</h1>
    <p>This test simulates the complete continue watching flow: watch video → save progress → display in continue watching</p>
    
    <div class="step">
        <h3>Step 1: Authentication</h3>
        <button onclick="checkAuth()">🔍 Check Authentication</button>
        <button onclick="clearConsole()">🧹 Clear Console</button>
    </div>
    
    <div class="step">
        <h3>Step 2: Simulate Watching Movie</h3>
        <button onclick="simulateWatching()">🎥 Simulate Watching "The Matrix"</button>
        <button onclick="simulateWatchingTV()">📺 Simulate Watching "Breaking Bad S01E01"</button>
    </div>
    
    <div class="step">
        <h3>Step 3: Check Continue Watching</h3>
        <button onclick="checkContinueWatching()">📋 Check Continue Watching List</button>
        <button onclick="refreshContinueWatching()">🔄 Refresh Continue Watching</button>
    </div>
    
    <div class="step">
        <h3>Step 4: Cleanup</h3>
        <button onclick="clearProgress()">🗑️ Clear Test Progress</button>
    </div>
    
    <div class="console" id="console"></div>

    <script>
        let authToken = null;
        
        function log(message, type = 'info') {
            const console = document.getElementById('console');
            const timestamp = new Date().toISOString().split('T')[1].split('.')[0];
            const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : type === 'warning' ? '⚠️' : 'ℹ️';
            const line = `[${timestamp}] ${prefix} ${message}\n`;
            console.textContent += line;
            console.scrollTop = console.scrollHeight;
        }
        
        function clearConsole() {
            document.getElementById('console').textContent = '';
        }

        async function checkAuth() {
            log('🔍 Checking authentication status...', 'info');
            
            try {
                // Check for various auth tokens
                const tokens = {
                    localStorage_sb_access: localStorage.getItem('sb-access-token'),
                    sessionStorage_sb_access: sessionStorage.getItem('sb-access-token'),
                };
                
                // Look for Supabase session data
                const supabaseKeys = Object.keys(localStorage).filter(k => k.startsWith('sb-'));
                log(`Found ${supabaseKeys.length} Supabase keys in localStorage`);
                
                for (const key of supabaseKeys) {
                    try {
                        const data = JSON.parse(localStorage.getItem(key) || '{}');
                        if (data.access_token) {
                            tokens[`localStorage_${key}`] = data.access_token;
                        }
                    } catch (e) {
                        log(`Failed to parse ${key}: ${e.message}`, 'warning');
                    }
                }
                
                log('Available tokens:', 'info');
                for (const [source, token] of Object.entries(tokens)) {
                    if (token) {
                        log(`  ${source}: ${token.substring(0, 20)}...`, 'success');
                        authToken = token; // Use the first found token
                    } else {
                        log(`  ${source}: null`, 'warning');
                    }
                }
                
                // Test authentication with continue-watching endpoint
                if (authToken) {
                    const response = await fetch('/api/continue-watching', {
                        headers: { 'Authorization': `Bearer ${authToken}` }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        log(`✅ Authentication successful (${data.items?.length || 0} continue watching items found)`, 'success');
                        return authToken;
                    } else {
                        const error = await response.json();
                        log(`❌ Authentication failed: ${response.status} - ${error.error}`, 'error');
                        authToken = null;
                        return null;
                    }
                } else {
                    log('❌ No tokens found - user not logged in', 'error');
                    log('💡 Please log in to the main app first, then come back here', 'info');
                    return null;
                }
                
            } catch (error) {
                log(`❌ Auth check error: ${error.message}`, 'error');
                return null;
            }
        }
        
        async function simulateWatching() {
            if (!authToken) {
                log('❌ Please check authentication first', 'error');
                return;
            }
            
            log('🎥 Simulating watching "The Matrix"...', 'info');
            
            const progressData = {
                contentId: 'movie-the-matrix-1999',
                currentTime: 2700, // 45 minutes
                duration: 8160,    // 136 minutes
                streamUrl: 'https://example.com/the-matrix.m3u8',
                subtitles: []
            };
            
            try {
                const response = await fetch('/api/progress', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(progressData)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    log('✅ Progress saved successfully for "The Matrix"', 'success');
                    log(`   - Progress: ${Math.round((progressData.currentTime / progressData.duration) * 100)}% (${Math.round(progressData.currentTime / 60)} min)`, 'info');
                } else {
                    log(`❌ Failed to save progress: ${result.error}`, 'error');
                }
            } catch (error) {
                log(`❌ Error saving progress: ${error.message}`, 'error');
            }
        }
        
        async function simulateWatchingTV() {
            if (!authToken) {
                log('❌ Please check authentication first', 'error');
                return;
            }
            
            log('📺 Simulating watching "Breaking Bad S01E01"...', 'info');
            
            const progressData = {
                contentId: 'tv-breaking-bad-s01e01',
                currentTime: 1800, // 30 minutes
                duration: 2880,    // 48 minutes
                streamUrl: 'https://example.com/breaking-bad-s01e01.m3u8',
                subtitles: []
            };
            
            try {
                const response = await fetch('/api/progress', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(progressData)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    log('✅ Progress saved successfully for "Breaking Bad S01E01"', 'success');
                    log(`   - Progress: ${Math.round((progressData.currentTime / progressData.duration) * 100)}% (${Math.round(progressData.currentTime / 60)} min)`, 'info');
                } else {
                    log(`❌ Failed to save progress: ${result.error}`, 'error');
                }
            } catch (error) {
                log(`❌ Error saving progress: ${error.message}`, 'error');
            }
        }
        
        async function checkContinueWatching() {
            if (!authToken) {
                log('❌ Please check authentication first', 'error');
                return;
            }
            
            log('📋 Checking continue watching list...', 'info');
            
            try {
                const response = await fetch('/api/continue-watching', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    const items = result.items || [];
                    log(`✅ Continue watching retrieved: ${items.length} items found`, 'success');
                    
                    if (items.length > 0) {
                        log('📺 Continue Watching Items:', 'info');
                        items.forEach((item, index) => {
                            const progress = Math.round(item.progress * 100);
                            const timeLeft = Math.round((item.duration - item.currentTime) / 60);
                            log(`   ${index + 1}. ${item.content_id}`, 'info');
                            log(`      Progress: ${progress}% | ${timeLeft} min remaining`, 'info');
                            log(`      Last watched: ${new Date(item.updated_at).toLocaleString()}`, 'info');
                        });
                    } else {
                        log('📺 No items in continue watching list', 'warning');
                        log('💡 Try simulating watching a movie/show first', 'info');
                    }
                } else {
                    log(`❌ Failed to get continue watching: ${result.error}`, 'error');
                }
            } catch (error) {
                log(`❌ Error checking continue watching: ${error.message}`, 'error');
            }
        }
        
        async function refreshContinueWatching() {
            log('🔄 Refreshing continue watching...', 'info');
            await checkContinueWatching();
        }
        
        async function clearProgress() {
            if (!authToken) {
                log('❌ Please check authentication first', 'error');
                return;
            }
            
            log('🗑️ Clearing test progress data...', 'info');
            
            const testIds = ['movie-the-matrix-1999', 'tv-breaking-bad-s01e01'];
            
            for (const contentId of testIds) {
                try {
                    // First get the progress to find the ID
                    const getResponse = await fetch(`/api/progress?id=${contentId}`, {
                        headers: { 'Authorization': `Bearer ${authToken}` }
                    });
                    
                    if (getResponse.ok) {
                        const getResult = await getResponse.json();
                        if (getResult.data && getResult.data[contentId]) {
                            log(`🗑️ Found progress for ${contentId}, removing...`, 'info');
                            // Note: The DELETE endpoint might need adjustment for content_id based deletion
                            // For now we'll just log that we found it
                        }
                    }
                } catch (error) {
                    log(`❌ Error clearing ${contentId}: ${error.message}`, 'error');
                }
            }
            
            log('✅ Cleanup completed', 'success');
            log('🔄 Checking continue watching after cleanup...', 'info');
            await checkContinueWatching();
        }
        
        // Auto-check auth on page load
        window.addEventListener('load', () => {
            setTimeout(checkAuth, 1000);
        });
    </script>
</body>
</html>
