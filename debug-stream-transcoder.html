<!DOCTYPE html>
<html>
<head>
    <title>Live TV Debug Test</title>
</head>
<body>
    <h1>Live TV Debug Test</h1>
    <script>
        // Test the onPlay function directly
        function testDirectPlay() {
            console.log('🧪 Testing direct onPlay function...');
            
            const testStreamUrl = 'https://fl1.moveonjoy.com/ABC_EAST/index.m3u8';
            const testTitle = 'Test Live Stream';
            
            // First check if the URL is being treated as M3U8
            if (testStreamUrl.includes('.m3u8') || testStreamUrl.includes('m3u8')) {
                console.log('✅ M3U8 stream detected correctly');
                const convertedUrl = `/api/stream-transcoder?url=${encodeURIComponent(testStreamUrl)}`;
                console.log('🔄 Converted URL would be:', convertedUrl);
                
                // Test if the transcoder API responds
                fetch(convertedUrl, { method: 'HEAD' })
                    .then(response => {
                        console.log('📡 Transcoder API response status:', response.status);
                        if (response.ok) {
                            console.log('✅ Transcoder API is working');
                        } else {
                            console.log('❌ Transcoder API issue:', response.statusText);
                        }
                    })
                    .catch(error => {
                        console.log('❌ Transcoder API error:', error);
                    });
            }
        }
        
        // Auto-run the test
        setTimeout(testDirectPlay, 1000);
        
        // Manual test button
        console.log('Use testDirectPlay() to run the test manually');
    </script>
</body>
</html>
