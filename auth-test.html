<!DOCTYPE html>
<html>
<head>
    <title>Auth Test Page</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .output { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; white-space: pre-wrap; }
        .error { background: #ffe6e6; }
        .success { background: #e6ffe6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Authentication Test</h1>
        
        <div>
            <button onclick="generateAuthLink()">1. Generate Auth Link</button>
            <button onclick="checkSession()">2. Check Current Session</button>
            <button onclick="testSessionsAPI()">3. Test Sessions API</button>
            <button onclick="clearSession()">4. Clear Session</button>
        </div>
        
        <div id="output" class="output"></div>
        
        <div id="authLink" style="display: none;">
            <h3>Click this link to authenticate:</h3>
            <a id="linkElement" href="#" target="_blank">Authentication Link</a>
        </div>
    </div>

    <script>
        const output = document.getElementById('output');
        
        function log(message, type = 'info') {
            console.log(message);
            const timestamp = new Date().toLocaleTimeString();
            output.textContent += `[${timestamp}] ${message}\n`;
            output.className = `output ${type}`;
            output.scrollTop = output.scrollHeight;
        }
        
        async function generateAuthLink() {
            try {
                log('Generating authentication link...');
                const response = await fetch('/api/auth/direct-auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: 'unlockfreedom1@gmail.com' })
                });
                
                const data = await response.json();
                if (data.success) {
                    log('Auth link generated successfully!', 'success');
                    document.getElementById('authLink').style.display = 'block';
                    document.getElementById('linkElement').href = data.actionLink;
                    document.getElementById('linkElement').textContent = data.actionLink;
                } else {
                    log('Failed to generate auth link: ' + JSON.stringify(data), 'error');
                }
            } catch (error) {
                log('Error generating auth link: ' + error.message, 'error');
            }
        }
        
        async function checkSession() {
            try {
                log('Checking current session...');
                const response = await fetch('/api/auth/session');
                const data = await response.json();
                
                if (data.session && data.session.user) {
                    log(`Session found! User: ${data.session.user.email}, Token length: ${data.session.access_token?.length || 'unknown'}`, 'success');
                    
                    // Store the session for testing
                    localStorage.setItem('access_token', data.session.access_token);
                } else {
                    log('No active session found');
                }
            } catch (error) {
                log('Error checking session: ' + error.message, 'error');
            }
        }
        
        async function testSessionsAPI() {
            try {
                const token = localStorage.getItem('access_token');
                if (!token) {
                    log('No access token found. Please authenticate first.', 'error');
                    return;
                }
                
                log('Testing sessions API with Authorization header...');
                const response = await fetch('/api/me/sessions', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                if (response.ok) {
                    log(`Sessions API success! Found ${data.sessions?.length || 0} sessions`, 'success');
                    log(JSON.stringify(data, null, 2));
                } else {
                    log(`Sessions API failed: ${data.error}`, 'error');
                }
            } catch (error) {
                log('Error testing sessions API: ' + error.message, 'error');
            }
        }
        
        async function clearSession() {
            localStorage.removeItem('access_token');
            log('Session cleared from localStorage');
        }
        
        // Check for session on page load
        window.addEventListener('load', () => {
            log('Page loaded. Testing authentication flow...');
            checkSession();
        });
    </script>
</body>
</html>
