version: '3.8'

services:
  movieplayer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movieplayer-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Add your environment variables here
      - NEXT_PUBLIC_TMDB_API_KEY=${NEXT_PUBLIC_TMDB_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REALDEBRID_API_KEY=${REALDEBRID_API_KEY}
      - TORBOX_API_KEY=${TORBOX_API_KEY}
      - OPENSUBTITLES_API_KEY=${OPENSUBTITLES_API_KEY}
    volumes:
      # Mount for persistent data if needed
      - movieplayer-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - movieplayer-network

volumes:
  movieplayer-data:
    driver: local

networks:
  movieplayer-network:
    driver: bridge