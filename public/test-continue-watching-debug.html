<!DOCTYPE html>
<html>
<head>
    <title>Continue Watching Debug</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Continue Watching Debug</h1>
    
    <div id="auth-status">Loading...</div>
    
    <div id="auth-section" style="margin: 20px 0;">
        <h3>Authentication</h3>
        <input type="email" id="email" placeholder="Enter email" style="margin-right: 10px;">
        <button onclick="signIn()">Sign In with Magic Link</button>
        <button onclick="signOut()">Sign Out</button>
        <button onclick="checkAuth()">Check Auth Status</button>
    </div>
    
    <div id="progress-section" style="margin: 20px 0;">
        <h3>Progress Management</h3>
        <button onclick="createTestProgress()">Create Test Progress</button>
        <button onclick="fetchContinueWatching()">Fetch Continue Watching</button>
        <button onclick="clearProgress()">Clear All Progress</button>
    </div>
    
    <div id="results" style="margin: 20px 0; border: 1px solid #ccc; padding: 10px; max-height: 400px; overflow-y: auto;">
        Results will appear here...
    </div>

    <script>
        // Initialize Supabase
        const SUPABASE_URL = 'https://xqjbznbtaxhqfffjrqie.supabase.co'
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhxamJ6bmJ0YXhocWZmZmpycWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzQ1NDQzNzMsImV4cCI6MjA1MDEyMDM3M30.OU6G7YT5LGhrlNxzL0t2gC_Ot9A3xCh8Rw-QZZJWp1Q'
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        
        function log(message, data = null) {
            const resultsDiv = document.getElementById('results')
            const timestamp = new Date().toLocaleTimeString()
            const entry = document.createElement('div')
            entry.style.marginBottom = '10px'
            entry.style.borderBottom = '1px solid #eee'
            entry.style.paddingBottom = '5px'
            
            if (data) {
                entry.innerHTML = `<strong>[${timestamp}]</strong> ${message}<br><pre style="background: #f5f5f5; padding: 5px; font-size: 12px;">${JSON.stringify(data, null, 2)}</pre>`
            } else {
                entry.innerHTML = `<strong>[${timestamp}]</strong> ${message}`
            }
            
            resultsDiv.insertBefore(entry, resultsDiv.firstChild)
        }
        
        async function checkAuth() {
            try {
                const { data: { session }, error } = await supabase.auth.getSession()
                
                if (error) {
                    log('Auth check error:', error)
                    document.getElementById('auth-status').innerHTML = '<span style="color: red;">Error checking auth</span>'
                    return
                }
                
                if (session) {
                    log('User authenticated:', {
                        user_id: session.user.id,
                        email: session.user.email,
                        access_token: session.access_token ? 'present' : 'missing'
                    })
                    document.getElementById('auth-status').innerHTML = `<span style="color: green;">✓ Authenticated as ${session.user.email}</span>`
                } else {
                    log('No active session')
                    document.getElementById('auth-status').innerHTML = '<span style="color: red;">✗ Not authenticated</span>'
                }
            } catch (err) {
                log('Auth check exception:', err)
                document.getElementById('auth-status').innerHTML = '<span style="color: red;">Error checking auth</span>'
            }
        }
        
        async function signIn() {
            const email = document.getElementById('email').value
            if (!email) {
                alert('Please enter an email')
                return
            }
            
            try {
                const { error } = await supabase.auth.signInWithOtp({
                    email: email,
                    options: { shouldCreateUser: true }
                })
                
                if (error) {
                    log('Sign in error:', error)
                } else {
                    log('Magic link sent to: ' + email)
                    alert('Check your email for the magic link!')
                }
            } catch (err) {
                log('Sign in exception:', err)
            }
        }
        
        async function signOut() {
            try {
                const { error } = await supabase.auth.signOut()
                if (error) {
                    log('Sign out error:', error)
                } else {
                    log('Signed out successfully')
                    document.getElementById('auth-status').innerHTML = '<span style="color: red;">✗ Not authenticated</span>'
                }
            } catch (err) {
                log('Sign out exception:', err)
            }
        }
        
        async function createTestProgress() {
            try {
                const { data: { session }, error: authError } = await supabase.auth.getSession()
                
                if (authError || !session) {
                    log('Need to be authenticated to create progress')
                    return
                }
                
                const testData = {
                    contentId: 'test-movie-' + Date.now(),
                    currentTime: 1800, // 30 minutes
                    duration: 7200, // 2 hours
                    streamUrl: 'https://example.com/stream.m3u8',
                    subtitles: []
                }
                
                const response = await fetch('/api/progress', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${session.access_token}`
                    },
                    body: JSON.stringify(testData)
                })
                
                const result = await response.json()
                log('Progress creation result:', { status: response.status, data: result })
                
            } catch (err) {
                log('Create progress exception:', err)
            }
        }
        
        async function fetchContinueWatching() {
            try {
                const { data: { session }, error: authError } = await supabase.auth.getSession()
                
                if (authError || !session) {
                    log('Need to be authenticated to fetch continue watching')
                    return
                }
                
                const response = await fetch('/api/continue-watching', {
                    headers: {
                        'Authorization': `Bearer ${session.access_token}`
                    }
                })
                
                const result = await response.json()
                log('Continue watching result:', { status: response.status, data: result })
                
            } catch (err) {
                log('Fetch continue watching exception:', err)
            }
        }
        
        async function clearProgress() {
            try {
                const { data: { session }, error: authError } = await supabase.auth.getSession()
                
                if (authError || !session) {
                    log('Need to be authenticated to clear progress')
                    return
                }
                
                const response = await fetch('/api/progress', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${session.access_token}`
                    },
                    body: JSON.stringify({ scope: 'all' })
                })
                
                const result = await response.json()
                log('Clear progress result:', { status: response.status, data: result })
                
            } catch (err) {
                log('Clear progress exception:', err)
            }
        }
        
        // Check auth status on load
        window.addEventListener('load', checkAuth)
        
        // Listen for auth state changes
        supabase.auth.onAuthStateChange((event, session) => {
            log('Auth state changed:', { event, session: session ? 'present' : 'null' })
            checkAuth()
        })
    </script>
</body>
</html>
