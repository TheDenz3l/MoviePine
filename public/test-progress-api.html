<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress API End-to-End Test</title>
    <style>
        body { 
            font-family: monospace; 
            max-width: 800px; 
            margin: 50px auto; 
            padding: 20px; 
            background: #1a1a1a; 
            color: #00ff00; 
        }
        .console { 
            background: #000; 
            padding: 20px; 
            border-radius: 5px; 
            height: 400px; 
            overflow-y: auto; 
            border: 1px solid #333; 
        }
        button { 
            background: #333; 
            color: #00ff00; 
            border: 1px solid #555; 
            padding: 10px 20px; 
            cursor: pointer; 
            margin: 10px 0; 
        }
        button:hover { background: #444; }
    </style>
</head>
<body>
    <h1>🎬 Progress API End-to-End Test</h1>
    <p>This test verifies the complete flow: save progress → retrieve progress → continue watching</p>
    
    <button onclick="runTest()">🚀 Run Test</button>
    <button onclick="clearConsole()">🧹 Clear Console</button>
    
    <div class="console" id="console"></div>

    <script>
        function log(message, isError = false) {
            const console = document.getElementById('console');
            const div = document.createElement('div');
            div.textContent = message;
            if (isError) {
                div.style.color = '#ff0000';
            }
            console.appendChild(div);
            console.scrollTop = console.scrollHeight;
        }
        
        function clearConsole() {
            document.getElementById('console').innerHTML = '';
        }

        async function runTest() {
            clearConsole();
            log('🎬 Testing Progress API End-to-End Flow...\n');
            
            try {
                // Step 1: Get auth token from localStorage (like the debug script does)
                log('Step 1: Getting auth token...');
                
                let token = null;
                
                // Try various token sources
                const tokenSources = {
                    'localStorage sb-access-token': localStorage.getItem('sb-access-token'),
                    'sessionStorage sb-access-token': sessionStorage.getItem('sb-access-token'),
                };
                
                // Check for Supabase session data
                const supabaseKeys = Object.keys(localStorage).filter(k => k.startsWith('sb-'));
                for (const key of supabaseKeys) {
                    try {
                        const data = JSON.parse(localStorage.getItem(key) || '{}');
                        if (data.access_token) {
                            tokenSources[`localStorage ${key}`] = data.access_token;
                        }
                    } catch (e) {
                        // Ignore parsing errors
                    }
                }
                
                // Use the first valid token
                for (const [source, tokenValue] of Object.entries(tokenSources)) {
                    if (tokenValue) {
                        token = tokenValue;
                        log(`✅ Got token from: ${source}`);
                        break;
                    }
                }
                
                if (!token) {
                    log('❌ No access token found. Please log in first.', true);
                    log('💡 Open the main page and log in, then come back to run this test.', true);
                    return;
                }
                
                const headers = {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                };
                
                // Step 2: Save some test progress
                log('\nStep 2: Saving test progress...');
                const progressData = {
                    contentId: 'test-movie-123',
                    currentTime: 1800, // 30 minutes
                    duration: 7200,    // 2 hours
                    streamUrl: 'https://example.com/stream.m3u8',
                    subtitles: []
                };
                
                const saveResponse = await fetch('/api/progress', {
                    method: 'POST',
                    headers,
                    body: JSON.stringify(progressData)
                });
                
                const saveResult = await saveResponse.json();
                log('Save response: ' + JSON.stringify(saveResult, null, 2));
                
                if (!saveResponse.ok) {
                    log('❌ Failed to save progress: ' + saveResult.error, true);
                    return;
                }
                
                log('✅ Progress saved successfully');
                
                // Step 3: Retrieve the progress
                log('\nStep 3: Retrieving progress...');
                const getResponse = await fetch(`/api/progress?id=${progressData.contentId}`, {
                    headers
                });
                
                const getResult = await getResponse.json();
                log('Get response: ' + JSON.stringify(getResult, null, 2));
                
                if (!getResponse.ok) {
                    log('❌ Failed to get progress: ' + getResult.error, true);
                    return;
                }
                
                log('✅ Progress retrieved successfully');
                
                // Step 4: Check continue watching
                log('\nStep 4: Checking continue watching...');
                const continueResponse = await fetch('/api/continue-watching', {
                    headers
                });
                
                const continueResult = await continueResponse.json();
                log('Continue watching response: ' + JSON.stringify(continueResult, null, 2));
                
                if (!continueResponse.ok) {
                    log('❌ Failed to get continue watching: ' + continueResult.error, true);
                    return;
                }
                
                log('✅ Continue watching retrieved successfully');
                
                // Step 5: Summary
                log('\n📊 SUMMARY:');
                log('- Progress API authentication: ✅ Working');
                log('- Progress saving: ✅ Working');
                log('- Progress retrieval: ✅ Working');
                log('- Continue watching API: ✅ Working');
                
                if (continueResult.data && continueResult.data.length > 0) {
                    log(`- Continue watching items: ${continueResult.data.length} found`);
                } else {
                    log('- Continue watching items: 0 found (may take a moment to appear)');
                }
                
            } catch (error) {
                log('❌ Test failed: ' + error.message, true);
            }
        }
    </script>
</body>
</html>
