<!DOCTYPE html>
<html>
<head>
    <title>FUCKING SIMPLE VIDEO TEST</title>
    <style>body { background: black; color: white; }</style>
</head>
<body>
    <h1>🔥 SIMPLE VIDEO TEST - DOES THIS WORK?</h1>
    
    <video 
        id="testVideo" 
        controls 
        width="800" 
        height="450"
        style="border: 2px solid red;"
    >
        Your browser doesn't support video.
    </video>
    
    <br><br>
    <button onclick="testBasicVideo()">Test Basic MP4</button>
    <button onclick="testHLS()">Test HLS Stream</button>
    
    <div id="log" style="margin-top: 20px; font-family: monospace;"></div>

    <script>
        const video = document.getElementById('testVideo');
        const log = document.getElementById('log');
        
        function addLog(msg) {
            console.log(msg);
            log.innerHTML += msg + '<br>';
        }
        
        function testBasicVideo() {
            addLog('🎬 Testing basic MP4...');
            video.src = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';
            video.load();
            video.play().then(() => {
                addLog('✅ MP4 playing!');
            }).catch(err => {
                addLog('❌ MP4 failed: ' + err);
            });
        }
        
        function testHLS() {
            addLog('🎬 Testing HLS stream...');
            video.src = 'https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8';
            video.load();
            video.play().then(() => {
                addLog('✅ HLS playing!');
            }).catch(err => {
                addLog('❌ HLS failed: ' + err);
            });
        }
        
        video.addEventListener('error', (e) => {
            addLog('❌ Video error: ' + e.target.error.code + ' - ' + e.target.error.message);
        });
        
        addLog('🔥 Ready to test - click a button above!');
    </script>
</body>
</html>
