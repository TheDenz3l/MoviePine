<!DOCTYPE html>
<html>
<head>
    <title>Authentication Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #1a1a1a; color: white; }
        .container { max-width: 800px; margin: 0 auto; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #2d5016; border: 1px solid #4caf50; }
        .error { background: #5d1a1a; border: 1px solid #f44336; }
        .warning { background: #5d4e1a; border: 1px solid #ff9800; }
        .info { background: #1a3a5d; border: 1px solid #2196f3; }
        button { padding: 10px 20px; margin: 5px; background: #333; color: white; border: 1px solid #555; border-radius: 5px; cursor: pointer; }
        button:hover { background: #555; }
        pre { background: #2a2a2a; padding: 15px; border-radius: 5px; overflow-x: auto; }
        .card { background: #2a2a2a; padding: 15px; border-radius: 8px; border: 1px solid #444; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Authentication Debug Tool</h1>
        
        <button onclick="checkAuth()">Check Authentication</button>
        <button onclick="checkSupabaseConnection()">Check Supabase Connection</button>
        <button onclick="checkDatabaseMigration()">Check Database Migration</button>
        <button onclick="testProgressSave()">Test Progress Save</button>
        <button onclick="runFullDiagnostic()">Run Full Diagnostic</button>
        
        <div id="status" class="status info">
            Click buttons above to diagnose authentication and database issues.
        </div>
        
        <div class="card">
            <h3>Authentication Status</h3>
            <div id="auth-status">Not checked yet.</div>
        </div>
        
        <div class="card">
            <h3>Database Connection</h3>
            <div id="db-status">Not checked yet.</div>
        </div>
        
        <div class="card">
            <h3>Debug Output</h3>
            <pre id="debug-output">Debug information will appear here...</pre>
        </div>
    </div>

    <script>
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const entry = `[${timestamp}] ${message}\n`;
            
            document.getElementById('debug-output').textContent += entry;
            
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
            
            console.log(entry.trim());
        }
        
        async function checkAuth() {
            log('🔍 Checking authentication status...', 'info');
            
            try {
                // Check for various auth tokens
                const tokens = {
                    localStorage_sb_access: localStorage.getItem('sb-access-token'),
                    sessionStorage_sb_access: sessionStorage.getItem('sb-access-token'),
                };
                
                // Look for Supabase session data
                const supabaseKeys = Object.keys(localStorage).filter(k => k.startsWith('sb-'));
                log(`Found ${supabaseKeys.length} Supabase keys in localStorage: ${supabaseKeys.join(', ')}`);
                
                for (const key of supabaseKeys) {
                    try {
                        const data = JSON.parse(localStorage.getItem(key) || '{}');
                        if (data.access_token) {
                            tokens[`localStorage_${key}`] = data.access_token;
                        }
                    } catch (e) {
                        log(`Failed to parse ${key}: ${e.message}`, 'warning');
                    }
                }
                
                log('Available tokens:', 'info');
                for (const [source, token] of Object.entries(tokens)) {
                    if (token) {
                        log(`  ${source}: ${token.substring(0, 20)}...`, 'success');
                    } else {
                        log(`  ${source}: null`, 'warning');
                    }
                }
                
                // Test authentication with continue-watching endpoint
                const firstToken = Object.values(tokens).find(t => t);
                if (firstToken) {
                    const response = await fetch('/api/continue-watching', {
                        headers: { 'Authorization': `Bearer ${firstToken}` }
                    });
                    
                    const authStatus = document.getElementById('auth-status');
                    if (response.ok) {
                        const data = await response.json();
                        authStatus.innerHTML = `✅ Authenticated (${data.items?.length || 0} items found)`;
                        log('✅ Authentication successful', 'success');
                        return firstToken;
                    } else {
                        authStatus.innerHTML = `❌ Authentication failed (${response.status})`;
                        log(`❌ Authentication failed: ${response.status}`, 'error');
                        return null;
                    }
                } else {
                    const authStatus = document.getElementById('auth-status');
                    authStatus.innerHTML = '❌ No tokens found - user not logged in';
                    log('❌ No authentication tokens found', 'error');
                    return null;
                }
                
            } catch (error) {
                log(`❌ Auth check error: ${error.message}`, 'error');
                return null;
            }
        }
        
        async function checkSupabaseConnection() {
            log('🔗 Checking Supabase connection...', 'info');
            
            try {
                // Try a simple API call that requires Supabase
                const response = await fetch('/api/me/settings');
                const dbStatus = document.getElementById('db-status');
                
                if (response.ok) {
                    dbStatus.innerHTML = '✅ Supabase connection working';
                    log('✅ Supabase connection successful', 'success');
                    return true;
                } else {
                    dbStatus.innerHTML = `❌ Supabase connection failed (${response.status})`;
                    log(`❌ Supabase connection failed: ${response.status}`, 'error');
                    return false;
                }
            } catch (error) {
                const dbStatus = document.getElementById('db-status');
                dbStatus.innerHTML = `❌ Supabase error: ${error.message}`;
                log(`❌ Supabase error: ${error.message}`, 'error');
                return false;
            }
        }
        
        async function checkDatabaseMigration() {
            log('📊 Checking database migration status...', 'info');
            
            const token = await checkAuth();
            if (!token) {
                log('❌ Cannot check migration - no authentication', 'error');
                return false;
            }
            
            try {
                // Test progress save
                const testData = {
                    contentId: `migration-test-${Date.now()}`,
                    currentTime: 600,
                    duration: 3600
                };
                
                const response = await fetch('/api/progress', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(testData)
                });
                
                const result = await response.json();
                log(`Progress save response: ${JSON.stringify(result, null, 2)}`);
                
                if (result.success && result.persisted !== false) {
                    log('✅ Database migration appears to be applied', 'success');
                    
                    // Clean up test data
                    try {
                        const deleteResponse = await fetch('/api/progress', {
                            method: 'DELETE',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify({ scope: 'watch' })
                        });
                        if (deleteResponse.ok) {
                            log('🧹 Cleaned up test data', 'info');
                        }
                    } catch (e) {
                        log(`⚠️ Cleanup failed: ${e.message}`, 'warning');
                    }
                    
                    return true;
                } else if (result.persisted === false) {
                    log('❌ Database migration NOT applied - progress not persisted', 'error');
                    log('💡 You need to run: supabase_phase2_migration_patch.sql', 'warning');
                    return false;
                } else {
                    log(`❌ Unknown database issue: ${JSON.stringify(result)}`, 'error');
                    return false;
                }
                
            } catch (error) {
                log(`❌ Database migration check failed: ${error.message}`, 'error');
                return false;
            }
        }
        
        async function testProgressSave() {
            log('💾 Testing progress save functionality...', 'info');
            
            const token = await checkAuth();
            if (!token) {
                log('❌ Cannot test progress save - no authentication', 'error');
                return false;
            }
            
            try {
                const testData = {
                    contentId: `test-movie-${Date.now()}`,
                    currentTime: 1800, // 30 minutes
                    duration: 7200     // 2 hours
                };
                
                log(`Testing with data: ${JSON.stringify(testData)}`);
                
                const response = await fetch('/api/progress', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(testData)
                });
                
                const result = await response.json();
                log(`Save result: ${JSON.stringify(result, null, 2)}`);
                
                if (result.success && result.persisted !== false) {
                    // Check if it appears in continue watching
                    const continueResponse = await fetch('/api/continue-watching', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    
                    const continueData = await continueResponse.json();
                    const foundItem = continueData.items?.find(item => 
                        item.content_id === testData.contentId
                    );
                    
                    if (foundItem) {
                        log('✅ Progress save test PASSED - item appears in continue watching', 'success');
                        return true;
                    } else {
                        log('⚠️ Progress saved but not appearing in continue watching', 'warning');
                        log(`Available items: ${continueData.items?.map(i => i.content_id).join(', ') || 'none'}`);
                        return false;
                    }
                } else {
                    log('❌ Progress save test FAILED', 'error');
                    return false;
                }
                
            } catch (error) {
                log(`❌ Progress save test error: ${error.message}`, 'error');
                return false;
            }
        }
        
        async function runFullDiagnostic() {
            log('🚀 Running full diagnostic...', 'info');
            log('='.repeat(50));
            
            const results = {
                auth: await checkAuth(),
                supabase: await checkSupabaseConnection(),
                migration: await checkDatabaseMigration(),
                progressSave: await testProgressSave()
            };
            
            log('='.repeat(50));
            log('📋 DIAGNOSTIC SUMMARY:', 'info');
            log(`Authentication: ${results.auth ? '✅ WORKING' : '❌ FAILED'}`, results.auth ? 'success' : 'error');
            log(`Supabase Connection: ${results.supabase ? '✅ WORKING' : '❌ FAILED'}`, results.supabase ? 'success' : 'error');
            log(`Database Migration: ${results.migration ? '✅ APPLIED' : '❌ NOT APPLIED'}`, results.migration ? 'success' : 'error');
            log(`Progress Save: ${results.progressSave ? '✅ WORKING' : '❌ FAILED'}`, results.progressSave ? 'success' : 'error');
            
            const allWorking = Object.values(results).every(Boolean);
            log(`\nOverall Status: ${allWorking ? '🎉 ALL SYSTEMS WORKING' : '🚨 ISSUES FOUND'}`, allWorking ? 'success' : 'error');
            
            if (!allWorking) {
                log('\n🔧 RECOMMENDED ACTIONS:', 'warning');
                if (!results.auth) log('1. Log in to the application', 'warning');
                if (!results.supabase) log('2. Check Supabase configuration', 'warning');
                if (!results.migration) log('3. Apply database migration: supabase_phase2_migration_patch.sql', 'warning');
                if (!results.progressSave) log('4. Debug progress save functionality', 'warning');
            }
            
            return results;
        }
        
        // Auto-run basic checks on load
        setTimeout(() => {
            log('🔄 Auto-running initial checks...', 'info');
            checkAuth().then(() => checkSupabaseConnection());
        }, 1000);
    </script>
</body>
</html>
