<!DOCTYPE html>
<html>
<head>
	<meta charset='utf-8'/>
	<title>Dev Instant Login</title>
	<style>
		body{font-family:system-ui,Arial;background:#111;color:#eee;padding:24px;max-width:760px;margin:0 auto;line-height:1.4}
		input,button{padding:10px;font-size:14px;border-radius:4px;border:1px solid #444;background:#222;color:#eee}
		button{cursor:pointer;margin-left:8px}
		pre{background:#000;padding:12px;border:1px solid #333;overflow:auto;font-size:12px;max-height:300px}
		.row{margin:12px 0}
		.small{font-size:12px;color:#aaa}
		.warn{color:#f8c555}
		.success{color:#4ade80}
		.error{color:#f87171}
	</style>
</head>
<body>
	<h1>⚡ Dev Instant Login</h1>
	<p>Generates a magic-link token_hash with the service key (no email), then attempts <code>verifyOtp</code>. If normal client flow fails, a raw REST fallback is attempted.</p>
	<div class='row'>
		<input id='email' type='email' placeholder='you@example.com' style='width:260px'>
		<button id='go'>Login</button>
		<button id='forceRest'>Force REST Verify</button>
		<button id='forceSession'>Force Server Session</button>
		<button id='session'>Check Session</button>
	</div>
	<div class='small'>SUPABASE_URL: <code id='su'></code></div>
	<div class='small'>Anon Key present: <code id='sk'></code></div>
	<pre id='log'></pre>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
	<script>
		const logEl=document.getElementById('log');
		function log(m){logEl.textContent+=`\n${new Date().toLocaleTimeString()} ${m}`;logEl.scrollTop=logEl.scrollHeight;console.log('[dev-login]',m)}
		const SUPABASE_URL=''; // Replaced process.env.NEXT_PUBLIC_SUPABASE_URL
		const SUPABASE_KEY=''; // Replaced process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY
		document.getElementById('su').textContent=SUPABASE_URL||'(missing)';
		document.getElementById('sk').textContent=SUPABASE_KEY? 'yes' : 'NO';
		if(!SUPABASE_URL||!SUPABASE_KEY) log('❌ Missing env values for client creation');
		const client = SUPABASE_URL&&SUPABASE_KEY ? window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,detectSessionInUrl:true}}) : null;
		let lastTokenHash=null; let lastType='magiclink'; let lastEmail=null; let lastVerifyTried=false;

		async function devLogin(email){
			lastEmail=email; lastTokenHash=null;
			if(!client) { log('❌ Supabase client not initialized'); return }
			log('Requesting token_hash for '+email);
			const r=await fetch(`/api/auth/dev-login?email=${encodeURIComponent(email)}`);
			const txt=await r.text();
			let j; try{ j=JSON.parse(txt);}catch(e){ log('❌ Non-JSON response: '+txt); return }
			log('Response: '+JSON.stringify(j));
			if(!j.token_hash){ log('❌ token_hash missing'); return }
			lastTokenHash=j.token_hash; lastType=j.type||'magiclink';
			await attemptVerify();
		}

		async function attemptVerify(){
			if(!lastTokenHash){ log('No token_hash to verify'); return }
			log('Calling verifyOtp type='+lastType+' token_hash='+lastTokenHash.slice(0,8)+'…');
			lastVerifyTried=true;
			const {data,error}=await client.auth.verifyOtp({type:lastType, token_hash:lastTokenHash});
			if(error){
				log('verifyOtp error: '+error.message);
				log('Attempting REST fallback...');
				await restFallback();
				return;
			}
			log('✅ verifyOtp success user='+ (data.user?.email||'unknown'));
			const sess=await client.auth.getSession();
			log('Session: '+ (sess.data.session? 'present':'missing'));
		}

		async function restFallback(){
			try {
				const url=`${SUPABASE_URL}/auth/v1/verify?type=${encodeURIComponent(lastType)}&token_hash=${encodeURIComponent(lastTokenHash)}`;
				log('REST verify URL: '+url.replace(lastTokenHash,lastTokenHash.slice(0,8)+'…'));
				const resp=await fetch(url,{method:'GET',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}});
				const text=await resp.text();
				log('REST status '+resp.status+' body '+text.slice(0,200));
			} catch(e){ log('REST fallback error: '+e.message) }
		}

		async function checkSession(){
			if(!client){ log('No client'); return }
			const { data } = await client.auth.getSession();
			log('Manual session check: '+ (data.session? 'present user='+data.session.user?.email : 'none'))
		}

		document.getElementById('go').onclick=()=>{
			const email=document.getElementById('email').value.trim();
			if(!email) return alert('email required');
			devLogin(email);
		}
			async function forceServerSession(){
				if(!lastEmail){ log('No prior email; enter and click Login first or type email then Force Session.'); const email=document.getElementById('email').value.trim(); if(email) lastEmail=email; }
				if(!lastEmail) return;
				log('Requesting server-created session for '+lastEmail);
				const r = await fetch('/api/auth/dev-set-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:lastEmail})});
				const j = await r.json().catch(()=>null);
				log('Server session response: '+JSON.stringify(j).slice(0,400));
				// The /auth/v1/verify endpoint should have set cookies if executed via server? If not, we can attempt setSession.
				if (j?.session?.access_token && client) {
					log('Attempting client.setSession with returned tokens');
					const { data, error } = await client.auth.setSession({ access_token: j.session.access_token, refresh_token: j.session.refresh_token });
					if (error) log('setSession error: '+error.message); else log('setSession success user='+(data.session?.user?.email||'unknown'));
				}
				await checkSession();
			}

			document.getElementById('session').onclick=checkSession;
		document.getElementById('forceRest').onclick=restFallback;
			document.getElementById('forceSession').onclick=forceServerSession;
	</script>
</body>
</html>
