<!DOCTYPE html>
<html>
<head>
    <title>Auth Debug & Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .debug-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .success { background: #d4edda; border-color: #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border-color: #f5c6cb; color: #721c24; }
        .info { background: #d1ecf1; border-color: #bee5eb; color: #0c5460; }
        button { padding: 10px 20px; margin: 10px 0; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        input[type="email"] { padding: 8px; margin: 10px 0; width: 300px; border: 1px solid #ddd; border-radius: 4px; }
        #logs { max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 12px; background: #f8f9fa; padding: 15px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>🔐 Auth Debug & Login System</h1>
    
    <div class="debug-section info">
        <h3>Current Status</h3>
        <div id="status">Checking authentication...</div>
        <div id="config-info"></div>
    </div>
    
    <div class="debug-section">
        <h3>🔑 Login with Magic Link</h3>
        <input type="email" id="email" placeholder="Enter your email address" value="test@example.com">
        <br>
        <button onclick="sendMagicLink()">Send Magic Link</button>
        <div id="login-status"></div>
    </div>
    
    <div class="debug-section">
        <h3>🧪 Test Authentication</h3>
        <button onclick="checkSession()">Check Current Session</button>
        <button onclick="signOut()">Sign Out</button>
        <button onclick="testAuthFlow()">Test Full Auth Flow</button>
    </div>
    
    <div class="debug-section">
        <h3>📋 Debug Logs</h3>
        <button onclick="clearLogs()">Clear Logs</button>
        <div id="logs"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://iiwmvmhgtxosaqnpqbev.supabase.co'
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlpd212bWhndHhvc2FxbnBxYmV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ2ODUwMTAsImV4cCI6MjA3MDI2MTAxMH0.SyyALGKn4PIgOLCs5USBv1CKEqe9W1d5hHWUlVNepLM'
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        
        function log(message, type = 'info') {
            const logs = document.getElementById('logs')
            const timestamp = new Date().toLocaleTimeString()
            const entry = document.createElement('div')
            entry.style.marginBottom = '5px'
            entry.style.color = type === 'error' ? '#dc3545' : type === 'success' ? '#28a745' : '#6c757d'
            entry.innerHTML = `<strong>[${timestamp}]</strong> ${message}`
            logs.insertBefore(entry, logs.firstChild)
        }
        
        function updateStatus(message, type = 'info') {
            const status = document.getElementById('status')
            status.innerHTML = message
            status.className = 'debug-section ' + type
        }
        
        function clearLogs() {
            document.getElementById('logs').innerHTML = ''
        }
        
        async function checkSession() {
            try {
                log('Checking current session...')
                const { data: { session }, error } = await supabase.auth.getSession()
                
                if (error) {
                    log(`Session error: ${error.message}`, 'error')
                    updateStatus('❌ Session Error: ' + error.message, 'error')
                    return
                }
                
                if (session) {
                    log(`✅ Active session found for user: ${session.user.email}`, 'success')
                    updateStatus(`✅ Logged in as: ${session.user.email}`, 'success')
                    return session
                } else {
                    log('No active session found', 'info')
                    updateStatus('❌ Not logged in', 'error')
                    return null
                }
            } catch (err) {
                log(`Session check failed: ${err.message}`, 'error')
                updateStatus('❌ Session check failed: ' + err.message, 'error')
                return null
            }
        }
        
        async function sendMagicLink() {
            const email = document.getElementById('email').value.trim()
            if (!email) {
                alert('Please enter an email address')
                return
            }
            
            const loginStatus = document.getElementById('login-status')
            loginStatus.innerHTML = 'Sending magic link...'
            
            try {
                log(`Sending magic link to: ${email}`)
                
                // Updated redirect URL to use our auth callback
                const { data, error } = await supabase.auth.signInWithOtp({
                    email: email,
                    options: {
                        emailRedirectTo: `${window.location.origin}/api/auth/callback?next=/`
                    }
                })
                
                if (error) {
                    log(`Magic link error: ${error.message}`, 'error')
                    loginStatus.innerHTML = `❌ Error: ${error.message}`
                    loginStatus.className = 'error'
                } else {
                    log('✅ Magic link sent successfully!', 'success')
                    loginStatus.innerHTML = `✅ Magic link sent to ${email}! Check your email and click the link to login.`
                    loginStatus.className = 'success'
                }
            } catch (err) {
                log(`Magic link failed: ${err.message}`, 'error')
                loginStatus.innerHTML = `❌ Failed: ${err.message}`
                loginStatus.className = 'error'
            }
        }
        
        async function signOut() {
            try {
                log('Signing out...')
                const { error } = await supabase.auth.signOut()
                if (error) {
                    log(`Sign out error: ${error.message}`, 'error')
                } else {
                    log('✅ Signed out successfully', 'success')
                    updateStatus('❌ Signed out', 'info')
                }
            } catch (err) {
                log(`Sign out failed: ${err.message}`, 'error')
            }
        }
        
        async function testAuthFlow() {
            log('=== Testing Full Authentication Flow ===')
            
            // 1. Check current session
            const session = await checkSession()
            
            // 2. Test API endpoints
            try {
                log('Testing auth callback endpoint...')
                const callbackResponse = await fetch('/api/auth/callback?code=test-code')
                log(`Auth callback status: ${callbackResponse.status}`)
                
                if (session) {
                    log('Testing continue-watching API...')
                    const continueResponse = await fetch('/api/continue-watching', {
                        headers: {
                            'Authorization': `Bearer ${session.access_token}`
                        }
                    })
                    log(`Continue watching API status: ${continueResponse.status}`)
                    
                    if (continueResponse.ok) {
                        const data = await continueResponse.json()
                        log(`Continue watching returned ${data.items?.length || 0} items`, 'success')
                    }
                }
            } catch (err) {
                log(`API test failed: ${err.message}`, 'error')
            }
        }
        
        // Auto-check session on load
        window.addEventListener('load', async () => {
            document.getElementById('config-info').innerHTML = `
                <strong>Configuration:</strong><br>
                Supabase URL: ${SUPABASE_URL}<br>
                Callback URL: ${window.location.origin}/api/auth/callback<br>
                Current URL: ${window.location.href}
            `
            
            await checkSession()
            
            // Listen for auth changes
            supabase.auth.onAuthStateChange((event, session) => {
                log(`🔔 Auth event: ${event}`)
                if (event === 'SIGNED_IN') {
                    updateStatus(`✅ Logged in as: ${session.user.email}`, 'success')
                } else if (event === 'SIGNED_OUT') {
                    updateStatus('❌ Signed out', 'info')
                }
            })
        })
    </script>
</body>
</html>
