<!DOCTYPE html>
<html>
<head>
    <title>Continue Watching Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #1a1a1a; color: white; }
        .container { max-width: 800px; margin: 0 auto; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #2d5016; border: 1px solid #4caf50; }
        .error { background: #5d1a1a; border: 1px solid #f44336; }
        .warning { background: #5d4e1a; border: 1px solid #ff9800; }
        .info { background: #1a3a5d; border: 1px solid #2196f3; }
        button { padding: 10px 20px; margin: 5px; background: #333; color: white; border: 1px solid #555; border-radius: 5px; cursor: pointer; }
        button:hover { background: #555; }
        textarea { width: 100%; height: 200px; background: #2a2a2a; color: white; border: 1px solid #555; padding: 10px; font-family: monospace; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 20px 0; }
        .card { background: #2a2a2a; padding: 15px; border-radius: 8px; border: 1px solid #444; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Continue Watching Debug Tool</h1>
        
        <div class="grid">
            <button onclick="checkAuth()">Check Authentication</button>
            <button onclick="checkDatabase()">Check Database Schema</button>
            <button onclick="simulateProgress()">Simulate Progress Save</button>
            <button onclick="fetchContinueWatching()">Fetch Continue Watching</button>
            <button onclick="refreshComponent()">Refresh Component</button>
            <button onclick="runFullTest()">Run Full Test</button>
        </div>
        
        <div id="status" class="status info">
            Ready to debug. Click buttons above to test functionality.
        </div>
        
        <div class="card">
            <h3>Test Results</h3>
            <textarea id="results" placeholder="Test results will appear here..."></textarea>
        </div>
        
        <div class="card">
            <h3>Current Continue Watching Items</h3>
            <div id="items">No items loaded yet.</div>
        </div>
    </div>

    <script>
        let logBuffer = [];
        
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const entry = `[${timestamp}] ${message}`;
            logBuffer.push(entry);
            
            document.getElementById('results').value = logBuffer.join('\n');
            document.getElementById('results').scrollTop = document.getElementById('results').scrollHeight;
            
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
            
            console.log(entry);
        }
        
        async function getAuthToken() {
            // Try to get token from localStorage first
            const token = localStorage.getItem('sb-access-token');
            if (token) return token;
            
            // Try to get from session storage
            const sessionToken = sessionStorage.getItem('sb-access-token');
            if (sessionToken) return sessionToken;
            
            // Look for supabase session in localStorage
            const keys = Object.keys(localStorage);
            const supabaseKey = keys.find(k => k.startsWith('sb-') && k.includes('auth-token'));
            if (supabaseKey) {
                const data = JSON.parse(localStorage.getItem(supabaseKey) || '{}');
                if (data.access_token) return data.access_token;
            }
            
            return null;
        }
        
        async function checkAuth() {
            log('Checking authentication...', 'info');
            
            const token = await getAuthToken();
            if (!token) {
                log('❌ No auth token found. Please log in first.', 'error');
                return false;
            }
            
            try {
                const response = await fetch('/api/continue-watching', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✅ Authentication successful. Found ${data.items?.length || 0} items.`, 'success');
                    return true;
                } else {
                    log(`❌ Authentication failed: ${response.status}`, 'error');
                    return false;
                }
            } catch (error) {
                log(`❌ Auth check error: ${error.message}`, 'error');
                return false;
            }
        }
        
        async function checkDatabase() {
            log('Checking database schema...', 'info');
            
            const token = await getAuthToken();
            if (!token) {
                log('❌ No auth token for database check', 'error');
                return false;
            }
            
            try {
                const response = await fetch('/api/progress?id=schema-test', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.ok) {
                    log('✅ Database schema working', 'success');
                    return true;
                } else {
                    log(`❌ Database error: ${response.status}`, 'error');
                    return false;
                }
            } catch (error) {
                log(`❌ Database check error: ${error.message}`, 'error');
                return false;
            }
        }
        
        async function simulateProgress() {
            log('Simulating progress save...', 'info');
            
            const token = await getAuthToken();
            if (!token) {
                log('❌ No auth token for progress save', 'error');
                return false;
            }
            
            const testData = {
                contentId: `test-movie-${Date.now()}`,
                currentTime: 1800, // 30 minutes
                duration: 7200,    // 2 hours
                streamUrl: 'https://example.com/test-stream.mp4'
            };
            
            try {
                const response = await fetch('/api/progress', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(testData)
                });
                
                if (response.ok) {
                    const result = await response.json();
                    log(`✅ Progress saved: ${testData.contentId} at ${Math.round((testData.currentTime/testData.duration)*100)}%`, 'success');
                    return true;
                } else {
                    const errorText = await response.text();
                    log(`❌ Progress save failed: ${response.status} - ${errorText}`, 'error');
                    return false;
                }
            } catch (error) {
                log(`❌ Progress save error: ${error.message}`, 'error');
                return false;
            }
        }
        
        async function fetchContinueWatching() {
            log('Fetching continue watching items...', 'info');
            
            const token = await getAuthToken();
            if (!token) {
                log('❌ No auth token for fetching', 'error');
                return [];
            }
            
            try {
                const response = await fetch('/api/continue-watching', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const items = data.items || [];
                    log(`✅ Found ${items.length} continue watching items`, 'success');
                    
                    const itemsEl = document.getElementById('items');
                    if (items.length === 0) {
                        itemsEl.innerHTML = '<p>No items in progress.</p>';
                    } else {
                        itemsEl.innerHTML = items.map(item => `
                            <div style="background: #333; padding: 10px; margin: 5px 0; border-radius: 5px;">
                                <strong>${item.title || item.content_id}</strong><br>
                                Progress: ${Math.round(item.progress * 100)}% (${item.current_time}s / ${item.duration}s)<br>
                                Updated: ${new Date(item.updated_at).toLocaleString()}
                            </div>
                        `).join('');
                    }
                    
                    return items;
                } else {
                    log(`❌ Fetch failed: ${response.status}`, 'error');
                    return [];
                }
            } catch (error) {
                log(`❌ Fetch error: ${error.message}`, 'error');
                return [];
            }
        }
        
        function refreshComponent() {
            log('Attempting to refresh component...', 'info');
            
            if (typeof window.refreshContinueWatching === 'function') {
                window.refreshContinueWatching();
                log('✅ Component refresh triggered', 'success');
            } else {
                log('⚠️ Component refresh function not available', 'warning');
            }
        }
        
        async function runFullTest() {
            log('🚀 Running full test suite...', 'info');
            
            const results = {
                auth: await checkAuth(),
                database: await checkDatabase(),
                progressSave: await simulateProgress()
            };
            
            // Wait for database to process
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            const items = await fetchContinueWatching();
            results.itemsFound = items.length > 0;
            
            log('\n📊 FULL TEST RESULTS:', 'info');
            log(`Authentication: ${results.auth ? '✅' : '❌'}`, results.auth ? 'success' : 'error');
            log(`Database Schema: ${results.database ? '✅' : '❌'}`, results.database ? 'success' : 'error');
            log(`Progress Save: ${results.progressSave ? '✅' : '❌'}`, results.progressSave ? 'success' : 'error');
            log(`Items Found: ${results.itemsFound ? '✅' : '❌'}`, results.itemsFound ? 'success' : 'error');
            
            const allWorking = Object.values(results).every(Boolean);
            log(`Overall Status: ${allWorking ? '🎉 WORKING' : '⚠️ ISSUES FOUND'}`, allWorking ? 'success' : 'warning');
            
            return results;
        }
        
        // Auto-run basic checks on load
        setTimeout(async () => {
            log('🔄 Auto-running initial checks...', 'info');
            await checkAuth();
            await fetchContinueWatching();
        }, 1000);
    </script>
</body>
</html>
