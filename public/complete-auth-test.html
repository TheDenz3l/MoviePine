<!DOCTYPE html>
<html>
<head>
    <title>Complete Auth Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button { padding: 10px; margin: 5px; }
        #log { background: #f5f5f5; padding: 10px; height: 300px; overflow-y: auto; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🧪 Complete Authentication Test Suite</h1>
    
    <div class="test-section">
        <h3>Environment Check</h3>
        <div id="env-status">Checking...</div>
        <button onclick="checkEnvironment()">🔍 Check Environment</button>
    </div>

    <div class="test-section">
        <h3>Supabase Connection</h3>
        <div id="supabase-status">Not tested</div>
        <button onclick="testSupabaseConnection()">🔌 Test Connection</button>
    </div>

    <div class="test-section">
        <h3>Authentication Test</h3>
        <input type="email" id="email" placeholder="test@example.com" value="test@example.com">
        <br>
        <button onclick="testDevLogin()">🚀 Test Dev Login</button>
        <button onclick="testDirectAuth()">⚡ Test Direct Auth</button>
        <button onclick="testMagicLink()">📧 Test Magic Link</button>
        <button onclick="checkSession()">👤 Check Session</button>
        <button onclick="signOut()">🚪 Sign Out</button>
        <div id="auth-status">Not authenticated</div>
    </div>

    <div class="test-section">
        <h3>API Endpoints Test</h3>
        <button onclick="testAPIEndpoints()">🔧 Test All APIs</button>
        <div id="api-status">Not tested</div>
    </div>

    <div class="test-section">
        <h3>Test Log</h3>
        <button onclick="clearLog()">🧹 Clear Log</button>
        <pre id="log"></pre>
    </div>

    <script>
        const logEl = document.getElementById('log');
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const line = `[${timestamp}] ${message}\n`;
            logEl.textContent += line;
            logEl.scrollTop = logEl.scrollHeight;
            console.log(`[AuthTest] ${message}`);
        }

        function clearLog() {
            logEl.textContent = '';
        }

        // Initialize Supabase client
        const SUPABASE_URL = 'https://iiwmvmhgtxosaqnpqbev.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlpd212bWhndHhvc2FxbnBxYmV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ2ODUwMTAsImV4cCI6MjA3MDI2MTAxMH0.SyyALGKn4PIgOLCs5USBv1CKEqe9W1d5hHWUlVNepLM';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: true, detectSessionInUrl: true }
        });

        async function checkEnvironment() {
            log('🔍 Checking environment...');
            const envStatus = document.getElementById('env-status');
            
            try {
                const response = await fetch('/api/debug-supabase');
                const data = await response.json();
                
                if (data.success) {
                    envStatus.innerHTML = '<span class="success">✅ Environment OK - Supabase connected</span>';
                    log(`✅ Environment check passed. Found ${data.users.length} users, ${data.watchProgress.count} watch progress entries`);
                } else {
                    envStatus.innerHTML = '<span class="error">❌ Environment Error</span>';
                    log('❌ Environment check failed');
                }
            } catch (error) {
                envStatus.innerHTML = '<span class="error">❌ Environment Error</span>';
                log(`❌ Environment error: ${error.message}`);
            }
        }

        async function testSupabaseConnection() {
            log('🔌 Testing direct Supabase connection...');
            const supabaseStatus = document.getElementById('supabase-status');
            
            try {
                const { data, error } = await supabase.auth.getSession();
                if (error) throw error;
                
                supabaseStatus.innerHTML = '<span class="success">✅ Supabase connection OK</span>';
                log('✅ Direct Supabase connection successful');
                return true;
            } catch (error) {
                supabaseStatus.innerHTML = '<span class="error">❌ Supabase connection failed</span>';
                log(`❌ Supabase connection error: ${error.message}`);
                return false;
            }
        }

        async function testDirectAuth() {
            const email = document.getElementById('email').value;
            if (!email) {
                alert('Please enter an email');
                return;
            }
            
            log(`⚡ Testing direct auth for ${email}...`);
            
            try {
                const response = await fetch('/api/auth/direct-auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const data = await response.json();
                
                if (data.success && data.actionLink) {
                    log('✅ Direct auth link generated!');
                    log(`🔗 Opening authentication link...`);
                    
                    // Open the auth link in a new tab
                    const authWindow = window.open(data.actionLink, '_blank');
                    
                    log('ℹ️ Please check the new tab and close it after authentication completes');
                    log('ℹ️ Then click "Check Session" to verify authentication');
                    
                } else {
                    throw new Error(data.error || 'Unknown error');
                }
            } catch (error) {
                log(`❌ Direct auth failed: ${error.message}`);
            }
        }

        async function testDevLogin() {
            const email = document.getElementById('email').value;
            if (!email) {
                alert('Please enter an email');
                return;
            }
            
            log(`🚀 Testing dev login for ${email}...`);
            
            try {
                const response = await fetch(`/api/auth/dev-login?email=${encodeURIComponent(email)}`);
                const data = await response.json();
                
                if (data.success && data.token_hash) {
                    log('✅ Dev login token generated, attempting verification...');
                    
                    const { data: authData, error } = await supabase.auth.verifyOtp({
                        token_hash: data.token_hash,
                        type: 'magiclink'
                    });
                    
                    if (error) throw error;
                    
                    log('✅ Dev login successful!');
                    updateAuthStatus(authData.session);
                } else {
                    throw new Error(data.error || 'Unknown error');
                }
            } catch (error) {
                log(`❌ Dev login failed: ${error.message}`);
            }
        }

        async function testMagicLink() {
            const email = document.getElementById('email').value;
            if (!email) {
                alert('Please enter an email');
                return;
            }
            
            log(`📧 Testing magic link for ${email}...`);
            
            try {
                const response = await fetch('/api/auth/send-magic-link', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    log('✅ Magic link sent successfully! Check your email.');
                } else {
                    log(`❌ Magic link failed: ${data.error}`);
                }
            } catch (error) {
                log(`❌ Magic link error: ${error.message}`);
            }
        }

        async function checkSession() {
            log('👤 Checking current session...');
            
            try {
                const { data, error } = await supabase.auth.getSession();
                if (error) throw error;
                
                updateAuthStatus(data.session);
                
                if (data.session) {
                    log(`✅ Active session found for ${data.session.user.email}`);
                } else {
                    log('ℹ️ No active session');
                }
            } catch (error) {
                log(`❌ Session check error: ${error.message}`);
            }
        }

        async function signOut() {
            log('🚪 Signing out...');
            
            try {
                const { error } = await supabase.auth.signOut();
                if (error) throw error;
                
                log('✅ Signed out successfully');
                updateAuthStatus(null);
            } catch (error) {
                log(`❌ Sign out error: ${error.message}`);
            }
        }

        async function testAPIEndpoints() {
            log('🔧 Testing API endpoints...');
            const apiStatus = document.getElementById('api-status');
            
            const { data: session } = await supabase.auth.getSession();
            const token = session?.session?.access_token;
            
            const tests = [
                { name: 'Settings API', url: '/api/me/settings' },
                { name: 'Sessions API', url: '/api/me/sessions' },
                { name: 'Progress API', url: '/api/progress?id=test-movie' }
            ];
            
            let results = [];
            
            for (const test of tests) {
                try {
                    const headers = { 'Content-Type': 'application/json' };
                    if (token) headers.Authorization = `Bearer ${token}`;
                    
                    const response = await fetch(test.url, { headers });
                    const status = response.status;
                    
                    if (token && status === 200) {
                        results.push(`✅ ${test.name}: OK`);
                        log(`✅ ${test.name}: Working (${status})`);
                    } else if (!token && status === 401) {
                        results.push(`✅ ${test.name}: Properly secured`);
                        log(`✅ ${test.name}: Properly returning 401 when not authenticated`);
                    } else {
                        results.push(`⚠️ ${test.name}: ${status}`);
                        log(`⚠️ ${test.name}: Unexpected status ${status}`);
                    }
                } catch (error) {
                    results.push(`❌ ${test.name}: Error`);
                    log(`❌ ${test.name}: ${error.message}`);
                }
            }
            
            apiStatus.innerHTML = results.join('<br>');
        }

        function updateAuthStatus(session) {
            const authStatus = document.getElementById('auth-status');
            
            if (session) {
                authStatus.innerHTML = `<span class="success">✅ Authenticated as ${session.user.email}</span>`;
            } else {
                authStatus.innerHTML = '<span class="info">ℹ️ Not authenticated</span>';
            }
        }

        // Auto-check environment on load
        window.addEventListener('load', () => {
            log('🧪 Auth Test Suite loaded');
            checkEnvironment();
            checkSession();
        });

        // Listen for auth state changes
        supabase.auth.onAuthStateChange((event, session) => {
            log(`🔄 Auth state changed: ${event}`);
            updateAuthStatus(session);
        });
    </script>
</body>
</html>
